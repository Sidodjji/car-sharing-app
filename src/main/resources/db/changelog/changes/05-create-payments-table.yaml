databaseChangeLog:
  - changeSet:
      id: create-payments-table
      author: Andrii
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: VARCHAR(255)
              - column:
                  name: session_url
                  type: VARCHAR(2048)
              - column:
                  name: amount_total
                  type: BIGINT
              - column:
                  name: currency
                  type: VARCHAR(255)
              - column:
                  name: payment_intent_id
                  type: VARCHAR(255)
              - column:
                  name: rental_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_payments_rental_id
                    foreignKeyName: fk_payments_rental_id
                    references: rentals(id)
              - column:
                  name: payment_status
                  type: VARCHAR(255)
